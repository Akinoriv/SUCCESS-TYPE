[phases.setup]
nixPkgs = ["nodejs_23", "openssl"]

[phases.install]
cmds = [
  "npm install --legacy-peer-deps",
  "npm rebuild oxc-parser",
  "npx prisma generate"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "npx prisma db push --accept-data-loss && npx prisma db seed && node .output/server/index.mjs"
