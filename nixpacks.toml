[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = [
  "npm install --omit=optional --legacy-peer-deps",
  "npx prisma generate"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npx prisma migrate deploy && node .output/server/index.mjs"

[variables]
NUXT_NO_OXC = "1"
